services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: amir_local_password
      POSTGRES_DB: amir
    volumes:
      - amir_pgdata:/var/lib/postgresql/data
      # The database dump — place databasedump20260609.sql next to this file.
      - ./databasedump20260609.sql:/dump/dump.sql:ro
      - ./docker/restore.sh:/docker-entrypoint-initdb.d/restore.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amir"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      COMBINI_DATABASE_URL: postgres://postgres:amir_local_password@db:5432/amir
      # A throwaway secret for local use only.
      JWT_SECRET: local-development-secret-change-me-please-0123456789abcdef
    ports:
      - "3333:3333"

volumes:
  amir_pgdata:
